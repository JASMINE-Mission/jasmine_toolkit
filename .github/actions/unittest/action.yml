name: unittest
description: Unittest

runs:
  using: "composite"
  steps:
    - name: Install package
      env:
        BRANCH: ${{ github.ref_name }}
      run: |
        python -m pip install .[test]
      shell: bash

    - name: Test with pytest
      env:
        BRANCH: ${{ github.ref_name }}
      id: pytest
      continue-on-error: true
      run: |
        python -m pytest --forked jasmine_toolkit --cov=. --cov-report xml
      shell: bash

    - name: Notice Error
      if: ${{ steps.pytest.outcome == 'failure' }}
      run: exit 1
      shell: bash
