name: validation
description: Detailed test for code validation.

runs:
  using: composite
  steps:
    - name: Install package
      env:
        BRANCH: ${{ github.ref_name }}
      run: |
        python -m pip install .[test]
      shell: bash

    - name: Code validation
      env:
        BRANCH: ${{ github.ref_name }}
      id: pytest
      continue-on-error: true
      run: |
        python -m pytest -v --forked validation jasmine_toolkit
      shell: bash

    - name: Notice Slack
      if: ${{ steps.pytest.outcome == 'failure' }}
      uses: slackapi/slack-github-action@v1.21.0
      with:
        payload: |
          {
            "text": "some test in ${{ env.TEST_DIR }} failed in ${{ github.ref_name }}. Please checK the details in the corresponding errors in Actions in Github."
          }
      env:
        SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL}}

    - name: Notice Error
      if: ${{ steps.pytest.outcome == 'failure' }}
      run: exit 1
      shell: bash
